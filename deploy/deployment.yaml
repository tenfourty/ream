apiVersion: apps/v1
kind: Deployment
metadata:
  name: artifacts
  labels:
    app.kubernetes.io/name: artifacts
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # A new pod starts (and must pass its readiness probe) before the old one
      # stops -- migrate()'s advisory lock is exactly what makes that safe for
      # two pods to run this entrypoint against the same schema at once.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: artifacts
  template:
    metadata:
      labels:
        app.kubernetes.io/name: artifacts
    spec:
      # Above the CI runners (homelab-internal, 500000) and below the public
      # sites (homelab-public, 800000). Jeremy's ruling, 20 Sep 2026: "optimise
      # for our essential services; CI is what we lose when a node dies."
      #
      # Without this the pod sits at priority 0, so on a node loss it cannot
      # claim a node back from a build — the gallery would stay down while a
      # CI job it does not depend on finished. The class is defined in the
      # homelab repo (k8s/platform/priorityclasses.yaml); this file only names
      # it, and naming a class that does not exist yet stops the ReplicaSet
      # creating pods, so the two must land in that order.
      priorityClassName: homelab-lan
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # CI rewrites the tag on `deploy/kustomization.yaml`'s `images:` entry --
          # never edit the tag here.
          image: git.tenfourty.site/jeremy/artifacts:bootstrap
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: artifacts-config
            # optional: true is load-bearing: a cluster with no artifacts-nudge
            # Secret yet must still start this app, with nudging simply inert
            # (see artifacts.nudge's own docstring) -- never CreateContainerConfigError.
            - secretRef:
                name: artifacts-nudge
                optional: true
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: artifacts-db-app
                  key: uri
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              # Deliberately no cpu limit (fleet convention) -- memory only.
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # The router is fail-closed (`artifacts.app.create_app`): a probe with no
          # Host header, or the wrong one, gets a 404 from the router itself, never
          # a 200 from the app behind it. Every probe must therefore carry the
          # gallery Host explicitly.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: artifacts.tenfourty.site
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: artifacts.tenfourty.site
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
              httpHeaders:
                - name: Host
                  value: artifacts.tenfourty.site
      volumes:
        - name: tmp
          emptyDir: {}

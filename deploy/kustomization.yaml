apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The namespace itself, the CNPG database, and the ingresses are the homelab
# repo's side of this arc (same fixed names as here) -- this kustomization only
# ever targets the `artifacts` namespace, never creates it.
namespace: artifacts

resources:
  - deployment.yaml
  - service.yaml

# A content-hash suffix on the name (kustomize's default -- not disabled
# below), so an edit to artifacts-config.env produces a NEW ConfigMap name
# and rolls the Deployment; a plain `data:` ConfigMap of the same name would
# edit in place and the running pods would never notice.
configMapGenerator:
  - name: artifacts-config
    envs:
      - artifacts-config.env
    options:
      labels:
        app.kubernetes.io/name: artifacts

images:
  # CI rewrites ONLY this newTag line, to the first 12 hex characters of the
  # commit sha it just built and pushed. `bootstrap` is a placeholder tag that
  # is never expected to exist in the registry -- Flux is not pointed at this
  # path until the first real image has landed here.
  - name: git.tenfourty.site/jeremy/artifacts
    newTag: e1f84ed0096b

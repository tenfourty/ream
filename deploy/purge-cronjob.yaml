# THE THIRTY DAYS, MADE REAL.
#
# Jeremy chose a recoverable delete (20 Sep 2026) partly because it is honest
# about eventually being gone. A soft delete that nothing ever sweeps is not a
# thirty-day window, it is a hidden row for ever -- so the window is only as
# true as this file.
#
# It lives in the APP's deploy/ rather than in the homelab tree because
# kustomization.yaml's `images:` transformer rewrites the tag here on every CI
# run: the sweep is therefore always the same build as the app that wrote the
# rows, and can never drift into running last month's idea of what expiry
# means. The homelab side owns the namespace, the database and the ingresses;
# this is app behaviour and belongs with the app.
#
# 04:20 UTC, deliberately after the fleet's 03:30-04:05 dump window and after
# this service's own 03:50 backup: whatever it destroys has been in that
# night's dump first, so a purge that turns out to have been wrong is still
# recoverable from the NAS for fourteen days. Ordering those two the other way
# round would make this the only irreversible step in the system with no
# preceding copy.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: artifacts-purge-deleted
  namespace: artifacts
spec:
  schedule: "20 4 * * *"
  # Forbid, not Replace: this destroys rows. Two of them racing is not a
  # performance problem, it is two transactions deleting the same ids.
  concurrencyPolicy: Forbid
  # Kept longer than the backup job's 3. The log line names every id it
  # destroyed, and that list is the only remaining record of what went -- so
  # the history is the audit trail, and a week of it is the least that is
  # useful when somebody asks where a page went.
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  # A missed run must not be silently skipped forever: if the cluster was down
  # at 04:20, run it when it comes back rather than waiting another day.
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      # No retries. A failed purge is safe -- nothing was destroyed -- and
      # tomorrow's run does the same work. Retrying a partial destroy is the
      # only way this job could do something surprising.
      backoffLimit: 0
      template:
        metadata:
          # SELECTED BY THE NAMESPACE'S EGRESS POLICY, on purpose. Cilium
          # denies egress only for endpoints a policy selects, so WITHOUT this
          # label the purge pod would quietly have unrestricted egress -- more
          # access than the app it is part of, for a job that needs DNS and
          # Postgres and nothing else. With it, it inherits exactly the app's
          # own egress. (The backup CronJob is deliberately unselected because
          # its traffic is the NAS and the off-site repo; this one's traffic is
          # the app's traffic.)
          labels:
            app.kubernetes.io/name: artifacts
        spec:
          restartPolicy: Never
          priorityClassName: homelab-internal
          containers:
            - name: purge
              image: git.tenfourty.site/jeremy/artifacts:bootstrap
              command: [artifacts-admin, purge-deleted]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: artifacts-db-app
                      key: uri
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests: {cpu: 10m, memory: 64Mi}
                limits: {memory: 256Mi}

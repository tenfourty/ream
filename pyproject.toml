[project]
name = "ream"
version = "0.1.0"
description = "A self-hosted artifacts publisher: agents publish HTML pages over a keyed API; Jeremy views them in an Authelia-gated gallery."
readme = "README.md"
authors = [
    { name = "Jeremy Brown", email = "jeremy@tenfourty.com" }
]
requires-python = ">=3.12"
# NOTHING by default, on purpose (homelab-ij8.68, 23 Sep 2026). The agent tools
# -- artifacts-publish, -decide, -republish -- use only the standard library, and
# the service hands this package to agents on other machines from an open
# address. An agent that wants to publish a page must not have to install a web
# framework and a database driver to do it. The service itself installs the
# `server` extra (Dockerfile, CI); for local work: `uv sync --all-extras`.
dependencies = []

[project.optional-dependencies]
server = [
    "cryptography>=46",
    "fastapi>=0.141.1",
    "html5lib>=1.1",
    "markdown-it-py>=4",
    "markupsafe>=3.0.3",
    "mdit-py-plugins>=0.5",
    "psycopg[binary]>=3.3.6",
    "python-multipart>=0.0.32",
    "uvicorn>=0.53.0",
    "zstandard>=0.25",
]

[project.scripts]
ream = "ream.cli:main"
# The old command names work for good, beside the verbs of `ream`.
artifacts-admin = "ream.admin:main"
artifacts-publish = "ream.client:run"
artifacts-decide = "ream.decide:run"
artifacts-bead-metrics = "ream.beadmetrics:main"
artifacts-republish = "ream.republish:run"
artifacts-connect = "ream.connect_cli:run"
artifacts-beads-page = "ream.beadpage:run"

# Two top-level packages ship in the one wheel: `ream`, and `artifacts`, the old import
# name kept for good (a shim whose modules ARE the ream modules).
[tool.uv.build-backend]
module-name = ["ream", "artifacts"]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "playwright>=1.63.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.8",
]

[tool.pytest.ini_options]
# worksteal, not xdist's default `load`: idle workers take tests from the
# busiest one's tail, so the run ends when the work does, not when the unluckiest
# worker's last chunk does. Inert without -n. See pytest_collection_modifyitems
# in tests/conftest.py for where the slow tests go.
# -rs: the summary names every skipped test and why. Browser tests skip where
# there is no headless browser (a laptop without one; CI installs chromium and sets
# REAM_REQUIRE_BROWSER=1, so there a missing browser fails), and a bare "13 skipped"
# hid that for weeks (runcove-5t3oj.77).
addopts = "--dist=worksteal -rs"
# A test that hangs fails after 5 minutes with every thread's stack printed,
# naming itself, instead of holding a CI builder until the job's own limit
# (6 Oct 2026: a test job sat idle for 35 minutes and left no clue). The
# slowest test takes about 9 s; this only ever catches a hang.
timeout = 300
# "signal", not "thread": the thread method dumps stacks and kills the worker,
# and xdist drops a dead worker's stderr -- on 7 Oct 2026 a CI hang left only
# "node down: Not properly terminated". The signal method fails the hung test
# in place with its traceback, and the worker carries on.
timeout_method = "signal"
# `slow`: a test that genuinely needs more than a second, each with a one-line
# reason at the mark. At most ten may carry it; everything else stays under 1 s.
markers = [
    "slow(reason): genuinely needs more than a second; says why",
    "postgres_only: reads Postgres's catalogue or runs Postgres's own SQL; skipped when REAM_TEST_DB=sqlite",
    "background_thumbnails: publishes in this test start the real background thumbnail render (off by default in tests; see tests/conftest.py)",
]

[tool.ruff.lint]
# S (bandit) and B (bugbear) are worth enabling deliberately on a service whose
# whole job is handling credentials and publishing agent-authored HTML -- on
# top of ruff's E4/E7/E9/F + isort defaults, not replacing them.
extend-select = ["S", "B"]

[tool.ruff.lint.per-file-ignores]
# S101 flags `assert` -- pytest's idiom for every assertion, not a risk here.
# S311 flags `random.Random` as unfit for cryptographic use -- true, and
# irrelevant to a seeded fuzz corpus for a property test, which wants
# reproducible pseudo-randomness, never secrecy.
# F811 flags a pytest fixture imported from test_client and then taken as a
# parameter -- how pytest works, not a mistake. Per-line noqa stopped covering
# it once the formatter wrapped long signatures (homelab-ij8.25).
"tests/**" = ["S101", "S311", "F811"]

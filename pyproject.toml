[project]
name = "artifacts"
version = "0.1.0"
description = "A self-hosted artifacts publisher: agents publish HTML pages over a keyed API; Jeremy views them in an Authelia-gated gallery."
readme = "README.md"
authors = [
    { name = "Jeremy Brown", email = "jeremy@tenfourty.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "markupsafe>=3.0.3",
    "psycopg[binary]>=3.3.6",
    "uvicorn>=0.53.0",
]

[project.scripts]
artifacts-admin = "artifacts.admin:main"
artifacts-publish = "artifacts.client:run"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.8",
]

[tool.ruff.lint]
# S (bandit) and B (bugbear) are worth enabling deliberately on a service whose
# whole job is handling credentials and publishing agent-authored HTML -- on
# top of ruff's E4/E7/E9/F + isort defaults, not replacing them.
extend-select = ["S", "B"]

[tool.ruff.lint.per-file-ignores]
# S101 flags `assert` -- pytest's idiom for every assertion, not a risk here.
# S311 flags `random.Random` as unfit for cryptographic use -- true, and
# irrelevant to a seeded fuzz corpus for a property test, which wants
# reproducible pseudo-randomness, never secrecy.
"tests/**" = ["S101", "S311"]

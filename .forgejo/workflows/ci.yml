name: ci

# Quoted "on" deliberately: unquoted, YAML 1.1 (PyYAML, used to validate this file)
# reads the bare word as the boolean `true`, not the string key "on" -- Forgejo's own
# parser is YAML-1.2 and unaffected either way, but quoting removes the ambiguity for
# every other tool that ever reads this file.
"on":
  push:
    # A `ci/...` branch runs the tests only, never image or deploy: tests don't
    # run on the management machine (13 Oct 2026), so a change is proven here before it
    # reaches main.
    branches: [main, "ci/**"]
  workflow_dispatch:

# One queue per branch: main's runs stay in order (each one pins an image), and a
# ci/ branch no longer waits behind main's image and pin (runcove-5t3oj.41).
concurrency:
  group: artifacts-${{ github.ref_name }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    # docker-light, not docker: this job needs no docker-in-docker, only its
    # Postgres service container, and docker-light has five slots where docker has
    # one, so tests stop queueing behind every image build (runcove-5t3oj.41).
    runs-on: docker-light
    # A hung job fails here instead of holding a builder for the runner's default of hours
    # (6 Oct 2026: a test job sat idle for 35 min on a CPU-starved builder03).
    timeout-minutes: 20
    # Only in the public repo, NAMED (not "anything but the sec repo"): a copy of this file anywhere
    # else has its jobs skipped (the private repo runs sec.yml instead). A job whose `if:` is false
    # is never dispatched. Every job in this file carries this gate;
    # scripts/guards/workflow-runner-guard.sh refuses one that does not.
    if: "github.repository == 'runcove/artifacts' && !contains(github.event.head_commit.message, '[skip ci]')"
    services:
      postgres:
        image: postgres:18
        env:
          # No password literal anywhere: trust auth is fine for a service container
          # that exists only for the length of this job, on a network nothing else
          # can reach.
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The postgres service container has no declared HEALTHCHECK, so Actions
      # starts it and moves straight on -- nothing here waits for it to accept
      # connections. This loop is that wait: plain python3 (present on this
      # runner image; see docs/services/forge/readme.md), no extra dependency.
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('postgres', 5432), timeout=1).close()" \
              && exit 0
            sleep 1
          done
          echo "postgres never became reachable on port 5432" >&2
          exit 1

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.5/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: uv sync --frozen --all-extras

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

      # The commit guards (lefthook.yml, scripts/guards/) only protect a clone
      # that ran `lefthook install`, so a guard nobody installed is no guard at
      # all for an agent on another machine. Their selftests run here, and the
      # secret-on-argv scan runs over the WHOLE tree — the pre-commit hook only
      # ever sees a staged diff. --no-lefthook because this runner has no
      # lefthook binary: it prints a loud NOT PROVEN line for the dispatch
      # regression rather than passing silently. Needs bash, git and uv (the workflow-runner guard reads
      # YAML with PyYAML, from uv when the runner image has none).
      - name: guard selftests
        run: scripts/guards/run-selftests.sh --no-lefthook

      - name: pin-pr selftest
        run: .forgejo/scripts/pin-pr.sh --selftest

      - name: core-lock-pr selftest
        run: .forgejo/scripts/core-lock-pr.sh --selftest

      - name: sec-private-check selftest
        run: .forgejo/scripts/sec-private-check.sh --selftest

      - name: tests
        env:
          # The browser tests run in `test-sqlite`. Name no browser here (an explicit
          # path that is no file means "none"), so these parallel runs never find one.
          REAM_BROWSER: /nonexistent/browser
          # connect_timeout=30: production keeps its 5 s bound (db.py), but this
          # service shares the runner's 5.5 cores with the workers, and on a
          # loaded host a new backend took longer than 5 s to fork (29 Sep
          # 2026, three ConnectionTimeouts in an otherwise green run).
          PG_TEST_DSN: postgresql://postgres@postgres:5432/postgres?connect_timeout=30
          # This service container exists only for this job, so the tests may
          # turn its commit flushes off (tests/conftest.py, _declared_throwaway).
          REAM_TEST_PG_THROWAWAY: "1"
        # -n auto (one worker per core the runner gives this job), capped at 5:
        # more workers only queue behind each other and the Postgres service
        # (the deployment repo's CI-builders doc); each in its own database
        # (artifacts_test_<worker>) on this one Postgres service.
        run: uv run pytest -q -n auto --maxprocesses 5

  test-sqlite:
    # docker-light, not docker: this job needs no docker-in-docker, only its
    # Postgres service container, and docker-light has five slots where docker has
    # one, so tests stop queueing behind every image build (runcove-5t3oj.41).
    # Its own job, beside `test` (runcove-5t3oj.82): the Postgres suite alone takes
    # ~170 s, so the browser tests and the SQLite suite run alongside it on a second
    # docker-light slot instead of after it. Its Postgres service is for the browser
    # tests, which run on Postgres. Only `test` is named in the deployment's pin lander's
    # check; `pin` needs both, so a red run here still stops a pin.
    runs-on: docker-light
    # A hung job fails here instead of holding a builder for the runner's default of hours
    # (6 Oct 2026: a test job sat idle for 35 min on a CPU-starved builder03).
    # 30, not 20: a passing run takes 14-16 min, and on a slower docker-light runner on
    # 11 Nov 2026 every step passed but the SQLite suite was cut off at 99% by the 20.
    timeout-minutes: 30
    # Public repo only, named (see `test`); skipped in the private copy.
    if: "github.repository == 'runcove/artifacts' && !contains(github.event.head_commit.message, '[skip ci]')"
    services:
      postgres:
        image: postgres:18
        env:
          # No password literal anywhere: trust auth is fine for a service container
          # that exists only for the length of this job, on a network nothing else
          # can reach.
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The postgres service container has no declared HEALTHCHECK, so Actions
      # starts it and moves straight on -- nothing here waits for it to accept
      # connections. This loop is that wait: plain python3 (present on this
      # runner image; see docs/services/forge/readme.md), no extra dependency.
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('postgres', 5432), timeout=1).close()" \
              && exit 0
            sleep 1
          done
          echo "postgres never became reachable on port 5432" >&2
          exit 1

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.5/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: uv sync --frozen --all-extras

      # The browser tests (comments panel, hover cards, thumbnails, shim placement)
      # skip without a headless browser, and until runcove-5t3oj.81 CI had none, so
      # they only ever ran on a maintainer's machine. Debian's chromium, as the image
      # ships it (Dockerfile): the job container is node:22-bookworm and runs as root.
      # REAM_REQUIRE_BROWSER (below) turns a missing browser into a failure
      # instead of a skip.
      - name: install chromium
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends chromium fonts-dejavu-core
          chromium --version
          test -x /usr/bin/chromium

      # The browser tests, serially and in their own step. With chromium visible to
      # the 5-worker runs below, the first CI attempt hung (run 487: four panel tests
      # started at once, none finished, nothing printed for 10 minutes) on a job capped
      # at 2 CPUs and 1.5 GB; alone, the seven panel tests take ~30 s. REAM_
      # REQUIRE_BROWSER makes a missing browser fail here instead of skipping.
      # Postgres only: these test the page in a browser, not a database path.
      - name: browser tests
        env:
          REAM_BROWSER: /usr/bin/chromium
          REAM_REQUIRE_BROWSER: "1"
          PG_TEST_DSN: postgresql://postgres@postgres:5432/postgres?connect_timeout=30
          REAM_TEST_PG_THROWAWAY: "1"
        run: >-
          uv run pytest -v -n0 --timeout=120 --timeout-method=thread
          tests/test_panel_browser.py tests/test_shim_marks.py
          tests/test_thumbs.py tests/test_thumbnail_wall.py
          tests/test_render_findings_browser.py

      # The timing comparisons (tests marked `scaling`), serially: they skip in the
      # parallel runs, where other workers share the 2 CPUs and make the 8x page look
      # slower than it is.
      - name: scaling tests
        env:
          REAM_BROWSER: /nonexistent/browser
          PG_TEST_DSN: postgresql://postgres@postgres:5432/postgres?connect_timeout=30
          REAM_TEST_PG_THROWAWAY: "1"
        run: uv run pytest -q -n0 -m scaling -rs

      # The same suite on SQLite (the SQLite switch, slice 5): one database file
      # per worker, no server; tests marked postgres_only are skipped.
      - name: tests on SQLite
        env:
          REAM_TEST_DB: sqlite
          REAM_BROWSER: /nonexistent/browser
        run: uv run pytest -q -n auto --maxprocesses 5

  # core-bare (core-and-plugins design 7.3, slice 7b part 5): the whole core suite with no
  # plug-in installed and none loaded (REAM_PLUGINS=none), on Postgres and on SQLite, so
  # core is proven to stand alone for anyone who runs it. A job of its own beside `test`
  # and `test-sqlite`, which are unchanged; `pin` does not wait for it yet (the deployment's pin
  # lander names the checks it needs, and promoting this one to required is its change).
  # The browser tests stay in `test-sqlite`: they test the page, not plug-in loading.
  core-bare:
    runs-on: docker-light
    timeout-minutes: 25
    # Public repo only, named (see `test`); skipped in the private copy.
    if: "github.repository == 'runcove/artifacts' && !contains(github.event.head_commit.message, '[skip ci]')"
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
    env:
      REAM_PLUGINS: none
      REAM_BROWSER: /nonexistent/browser
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('postgres', 5432), timeout=1).close()" \
              && exit 0
            sleep 1
          done
          echo "postgres never became reachable on port 5432" >&2
          exit 1

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.13.5/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: uv sync --frozen --all-extras

      # Assert the premise, positively: no plug-in entry point in either group is
      # installed, and the loader is told to load none. A job that "passed" with a
      # plug-in present would prove nothing.
      - name: no plug-in installed, none selected
        run: |
          uv run python - <<'PY'
          import os
          from importlib import metadata
          found = [
              ep.name
              for group in ("ream.plugins", "artifacts.plugins")
              for ep in metadata.entry_points(group=group)
          ]
          assert found == [], f"plug-ins installed: {found}"
          assert os.environ["REAM_PLUGINS"] == "none"
          print("core-bare: 0 plug-in entry points, REAM_PLUGINS=none")
          PY

      - name: core suite on Postgres
        env:
          PG_TEST_DSN: postgresql://postgres@postgres:5432/postgres?connect_timeout=30
          REAM_TEST_PG_THROWAWAY: "1"
        run: uv run pytest -q -n auto --maxprocesses 5

      - name: core suite on SQLite
        env:
          REAM_TEST_DB: sqlite
        run: uv run pytest -q -n auto --maxprocesses 5

  # No `needs:` -- the image builds while the tests run. An image whose tests fail
  # is only ever pushed to the internal registry; `deploy` below waits for both.
  image:
    # A deploy builder of its own (the deployment's labels, 6 Nov 2026): one slot, main only.
    runs-on: deploy-docker
    # A hung job fails here instead of holding a builder for the runner's default of hours
    # (6 Oct 2026: a test job sat idle for 35 min on a CPU-starved builder03).
    timeout-minutes: 30
    # Only the public repo publishes here (named, not "anything but the sec repo"): a copy of this
    # file in any other repo, the private embargo repo first, never pushes to this registry.
    if: "github.repository == 'runcove/artifacts' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')"
    services:
      dind:
        image: docker:28-dind
        # No --dns here: act puts services on a user-defined network, where --dns only sets
        # the embedded resolver's forwarder -- the dind still sees `nameserver 127.0.0.11`,
        # its inner dockerd discards that loopback entry and gives ITS containers Google's
        # 8.8.8.8/8.8.4.4 (measured: run 2741 here, run 608 of another project).
        # The fix is on the inner side instead: `docker build` takes --network host
        # (below), so the build's containers use the dind's own embedded resolver
        # rather than the inner bridge's fallback. The "dns check" step proves it
        # on every run, against the configuration the build actually uses.
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://dind:2375
    # The pushed image as <repo>:<sha12>@sha256:<digest>, for the pin job.
    outputs:
      ref: ${{ steps.build.outputs.ref }}
      # The core image's ref (empty if its step failed, or if it reused an existing image);
      # the `core-lock` job reads it.
      core_ref: ${{ steps.core.outputs.ref }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Copied from another project's build-image workflow (first ~30
      # lines): the job container has no docker CLI of its own, only the dind
      # service, so install the static CLI and wait for the daemon before using it.
      - name: docker cli
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null

      # Proves the BUILD never resolves through Google: an inner
      # default bridge falls back to 8.8.8.8/8.8.4.4, and `docker build --network host`
      # avoids that by using the dind's own embedded resolver instead.
      #
      # This used to also assert `docker run --dns <the cluster resolver's ClusterIP>`,
      # read from the cluster on 19 Sep 2026. That was correct while the runner lived
      # IN the cluster and is wrong now: since 00:03 on 21 Sep the image job's builder
      # (then the `docker` label, cibuild01; `deploy-docker` since 6 Nov) is outside the cluster, which cannot reach a ClusterIP and
      # should not be able to. The right answer was not to ask for that address to be
      # opened up -- it was to notice the check was asserting a MECHANISM (one specific
      # resolver) rather than the PROPERTY it exists for, on a container configuration
      # the build does not even use.
      #
      # So: assert the property, against the configuration the build actually runs in.
      - name: dns check
        run: |
          set -euo pipefail
          hostconf=$(docker run --rm --network host alpine:3 cat /etc/resolv.conf)
          printf '%s\n' "$hostconf"
          if grep -q '8\.8\.[48]\.[48]' <<<"$hostconf"; then echo "a host-network build container would resolve via Google" >&2; exit 1; fi
          if grep -q '1\.1\.1\.1' <<<"$hostconf"; then echo "a host-network build container would resolve via Cloudflare" >&2; exit 1; fi
          grep -q '^nameserver ' <<<"$hostconf" || { echo "a host-network build container has no resolver at all" >&2; exit 1; }
          docker run --rm --network host alpine:3 getent hosts git.tenfourty.site \
            || { echo "a host-network build container cannot resolve git.tenfourty.site" >&2; exit 1; }

      - name: build and push
        id: build
        env:
          REGISTRY_PASSWORD: "${{ secrets.REGISTRY_PUSH_TOKEN }}"
        run: |
          set -eu
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "REGISTRY_PUSH_TOKEN is not set on this repo" >&2
            exit 1
          fi
          sha12="${GITHUB_SHA:0:12}"
          image="git.tenfourty.site/runcove/artifacts:${sha12}"

          printf '%s' "$REGISTRY_PASSWORD" | docker login git.tenfourty.site \
            -u artifacts-publisher --password-stdin  # this repo's own push account (package write only)

          # The release build uses only layers this runner built itself, never a tag pulled from
          # the registry (runcove-5t3oj.104); the runner's own layer store still spares a
          # rebuild of unchanged steps.
          # A re-run of a commit whose image is already in the registry must NOT rebuild and
          # re-push it: a rebuild has another digest, which would move a tag a pin may already
          # name (the deployment's pin lander refuses a re-pushed tag). Reuse it.
          reused=0
          if pulled=$(docker pull "$image" 2>&1); then
            # A tag's presence is NOT proof that CI built it (anyone able to push could have put
            # one there), so a reused image is never certified: no PUBLISHED line below, and the
            # pin lander, which needs exactly one, refuses a pin that only a re-run vouches for.
            echo "$image is already in the registry (a re-run): reusing it, nothing rebuilt or pushed, and not certified by this run"
            reused=1
          else
            case "$pulled" in
              *"manifest unknown"*|*"not found"*) ;;
              *) echo "$pulled" >&2; echo "could not tell whether $image exists" >&2; exit 1 ;;
            esac
            docker build --network host \
              --build-arg CHROMIUM_REFRESH="$(date -u +%G-W%V)" \
              -t "$image" .
            docker push "$image"
          fi
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$image" \
            | grep -m1 '^git.tenfourty.site/runcove/artifacts@sha256:' | cut -d@ -f2)
          [ -n "$digest" ] || { echo "no registry digest for $image after the push" >&2; exit 1; }
          echo "ref=${image}@${digest}" >> "$GITHUB_OUTPUT"
          echo "reused=${reused}" >> "$GITHUB_OUTPUT"
          # One line, printed once, that the deployment's pin lander reads from this job's log to bind
          # the pinned digest to main's own CI run (runcove-5t3oj.19): do not reword it.
          if [ "$reused" = 0 ]; then
            echo "PUBLISHED image=${image} digest=${digest}"
          else
            echo "REUSED image=${image} digest=${digest} (existing tag, not built or certified by this run)"
          fi

      # The plug-in-free core image (core-and-plugins design 7.1 option A, step 8): the same
      # build, tagged as runcove/artifacts-core:<sha12>, for the plug-in repo to build on.
      # The image built above IS the core image today (core carries no plug-in installed from
      # outside). Nothing consumes it yet and the pin job never reads it, so a failure here is
      # reported but does not fail the job: production's path is the step above. It logs in
      # again with the same token. A re-run reuses an existing core tag, as above.
      - name: push core image
        id: core
        continue-on-error: true
        env:
          REGISTRY_PASSWORD: "${{ secrets.REGISTRY_PUSH_TOKEN }}"
          # Tagged from the exact digest the build step produced, never from the mutable
          # :<sha12> tag; and only when this run built it (reused=0).
          BUILD_REF: ${{ steps.build.outputs.ref }}
          BUILD_REUSED: ${{ steps.build.outputs.reused }}
        run: |
          set -eu
          if [ "$BUILD_REUSED" != 0 ]; then
            echo "REUSED core: the image was not built by this run (reused=${BUILD_REUSED:-unset}), so no core image is pushed or certified"
            exit 0
          fi
          case "$BUILD_REF" in
            git.tenfourty.site/runcove/artifacts:*@sha256:*) ;;
            *) echo "unexpected build ref" >&2; exit 1 ;;
          esac
          [ -n "$REGISTRY_PASSWORD" ] || { echo "REGISTRY_PUSH_TOKEN is not set on this repo" >&2; exit 1; }
          sha12="${GITHUB_SHA:0:12}"
          core="git.tenfourty.site/runcove/artifacts-core:${sha12}"
          printf '%s' "$REGISTRY_PASSWORD" | docker login git.tenfourty.site \
            -u artifacts-publisher --password-stdin
          if pulled=$(docker pull "$core" 2>&1); then
            echo "REUSED core: $core already exists in the registry; nothing pushed, not certified by this run"
            exit 0
          fi
          case "$pulled" in
            *"manifest unknown"*|*"not found"*) ;;
            *) echo "$pulled" >&2; echo "could not tell whether $core exists" >&2; exit 1 ;;
          esac
          docker tag "$BUILD_REF" "$core"
          docker push "$core"
          digest=$(docker inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$core" \
            | grep -m1 '^git.tenfourty.site/runcove/artifacts-core@sha256:' | cut -d@ -f2)
          [ -n "$digest" ] || { echo "no registry digest for $core after the push" >&2; exit 1; }
          [ "$digest" = "${BUILD_REF##*@}" ] || { echo "core digest differs from the built image's" >&2; exit 1; }
          echo "ref=${core}@${digest}" >> "$GITHUB_OUTPUT"
          echo "PUBLISHED core image=${core} digest=${digest}"

  # Opens the pull request on the deployment repo that moves production onto this image
  # (15 Oct 2026): the manifests live there, pinned by digest, and only a
  # merged pin PR deploys. It changes the one `image:` line; the deployment's maintainer
  # merges it. PIN_PR_TOKEN belongs to a bot account that only reads the deployment repo
  # and pushes to its own fork, so a branch workflow reading it can open a PR at worst.
  pin:
    # Both: a failed or skipped test blocks the pin even though image is green.
    needs: [test, test-sqlite, image]
    # The shared deploy builder: plain `deploy` is runcove/runcove's alone and never takes an
    # artifacts job (7 Nov 2026). Needs only git, curl and python3 against the forge.
    runs-on: deploy-docker
    timeout-minutes: 10
    # OFF: production now pins from ream-homelab (9 Nov 2026), whose pin job opens the deployment's pin
    # PR, and the deployment's lander no longer accepts this repo as a source; `core-lock` below is the
    # only path on main. To roll back see docs/agent/runbooks/image-from-ream-homelab.md.
    if: "github.repository == 'runcove/artifacts' && false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The whole history: the script refuses to move production to an older commit.
          fetch-depth: 0

      - name: open the pin PR
        env:
          PIN_PR_TOKEN: ${{ secrets.PIN_PR_TOKEN }}
          # Through the environment, not interpolated into the script: the script
          # validates it as <repo>:<sha12>@sha256:<digest> before using it.
          IMAGE_REF: ${{ needs.image.outputs.ref }}
        run: .forgejo/scripts/pin-pr.sh "$GITHUB_SHA" "$IMAGE_REF"

  # The path to production (docs/decisions.md, 9 Nov 2026; `pin` above is off): opens the one pull request on
  # runcove/ream-homelab that moves its `core.lock` to this core image and asks the forge to merge
  # it when that repo's checks succeed; ream-homelab then builds the deployed image and opens the
  # deployment pin PR. Runs only when the `image` job published a core image this run
  # (a REUSED core has no new ref). CORE_LOCK_TOKEN belongs to an account that can push to and merge on
  # ream-homelab only.
  core-lock:
    needs: [test, test-sqlite, image]
    runs-on: deploy-docker
    timeout-minutes: 10
    if: "github.repository == 'runcove/artifacts' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]') && needs.image.outputs.core_ref != ''"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          # The whole history: the script refuses to move the lock to an older commit.
          fetch-depth: 0

      - name: open the core.lock PR
        env:
          CORE_LOCK_TOKEN: ${{ secrets.CORE_LOCK_TOKEN }}
          # Through the environment, not interpolated into the script: the script
          # validates it as the core image's <repo>:<sha12>@sha256:<digest> before using it.
          CORE_REF: ${{ needs.image.outputs.core_ref }}
        run: .forgejo/scripts/core-lock-pr.sh "$GITHUB_SHA" "$CORE_REF"

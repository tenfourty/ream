name: ci

# Quoted "on" deliberately: unquoted, YAML 1.1 (PyYAML, used to validate this file)
# reads the bare word as the boolean `true`, not the string key "on" -- Forgejo's own
# parser is YAML-1.2 and unaffected either way, but quoting removes the ambiguity for
# every other tool that ever reads this file.
"on":
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: artifacts-main
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: docker
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    services:
      postgres:
        image: postgres:18
        env:
          # No password literal anywhere: trust auth is fine for a service container
          # that exists only for the length of this job, on a network nothing else
          # can reach.
          POSTGRES_HOST_AUTH_METHOD: trust
    steps:
      - uses: actions/checkout@v4

      # The postgres service container has no declared HEALTHCHECK, so Actions
      # starts it and moves straight on -- nothing here waits for it to accept
      # connections. This loop is that wait: plain python3 (present on this
      # runner image; see docs/services/forge/readme.md), no extra dependency.
      - name: wait for postgres
        run: |
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('postgres', 5432), timeout=1).close()" \
              && exit 0
            sleep 1
          done
          echo "postgres never became reachable on port 5432" >&2
          exit 1

      - name: install uv
        run: |
          curl -LsSf https://astral.sh/uv/0.12.9/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: uv sync --frozen --all-extras

      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests

      # The commit guards (lefthook.yml, scripts/guards/) only protect a clone
      # that ran `lefthook install`, so a guard nobody installed is no guard at
      # all for an agent on another machine. Their selftests run here, and the
      # secret-on-argv scan runs over the WHOLE tree — the pre-commit hook only
      # ever sees a staged diff. --no-lefthook because this runner has no
      # lefthook binary: it prints a loud NOT PROVEN line for the dispatch
      # regression rather than passing silently. Needs nothing but bash and git.
      - name: guard selftests
        run: scripts/guards/run-selftests.sh --no-lefthook

      - name: tests
        env:
          PG_TEST_DSN: postgresql://postgres@postgres:5432/postgres
        # -n auto: one xdist worker per core, each in its own database
        # (artifacts_test_<worker>) on this one Postgres service.
        run: uv run pytest -q -n auto

  image:
    needs: test
    runs-on: docker
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    services:
      dind:
        image: docker:28-dind
        # No --dns here: act puts services on a user-defined network, where --dns only sets
        # the embedded resolver's forwarder -- the dind still sees `nameserver 127.0.0.11`,
        # its inner dockerd discards that loopback entry and gives ITS containers Google's
        # 8.8.8.8/8.8.4.4 (measured: run 2741 here, warpgate run 608; bead homelab-bmr).
        # The fix is on the inner side instead: `docker build` takes --network host
        # (below), so the build's containers use the dind's own embedded resolver
        # rather than the inner bridge's fallback. The "dns check" step proves it
        # on every run, against the configuration the build actually uses.
        options: --privileged
        env:
          DOCKER_TLS_CERTDIR: ""
    env:
      DOCKER_HOST: tcp://dind:2375
    steps:
      - uses: actions/checkout@v4

      # Copied from ~/repos/warpgate/.forgejo/workflows/build-image.yml (first ~30
      # lines): the job container has no docker CLI of its own, only the dind
      # service, so install the static CLI and wait for the daemon before using it.
      - name: docker cli
        run: |
          curl -fsSL https://download.docker.com/linux/static/stable/x86_64/docker-28.3.3.tgz | tar xz -C /tmp
          install /tmp/docker/docker /usr/local/bin/docker
          for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 2; done
          docker info >/dev/null

      # Proves the BUILD never resolves through Google (bead homelab-bmr): an inner
      # default bridge falls back to 8.8.8.8/8.8.4.4, and `docker build --network host`
      # avoids that by using the dind's own embedded resolver instead.
      #
      # This used to also assert `docker run --dns 10.96.0.10` -- kube-dns's ClusterIP,
      # read from the cluster on 19 Sep 2026. That was correct while the runner lived
      # IN the cluster and is wrong now: since 00:03 on 21 Sep the `docker` label is
      # served by cibuild01, outside the cluster, which cannot reach a ClusterIP and
      # should not be able to. The right answer was not to ask for that address to be
      # opened up -- it was to notice the check was asserting a MECHANISM (one specific
      # resolver) rather than the PROPERTY it exists for, on a container configuration
      # the build does not even use.
      #
      # So: assert the property, against the configuration the build actually runs in.
      - name: dns check
        run: |
          set -euo pipefail
          hostconf=$(docker run --rm --network host alpine:3 cat /etc/resolv.conf)
          printf '%s\n' "$hostconf"
          if grep -q '8\.8\.[48]\.[48]' <<<"$hostconf"; then echo "a host-network build container would resolve via Google" >&2; exit 1; fi
          if grep -q '1\.1\.1\.1' <<<"$hostconf"; then echo "a host-network build container would resolve via Cloudflare" >&2; exit 1; fi
          grep -q '^nameserver ' <<<"$hostconf" || { echo "a host-network build container has no resolver at all" >&2; exit 1; }
          docker run --rm --network host alpine:3 getent hosts git.tenfourty.site \
            || { echo "a host-network build container cannot resolve git.tenfourty.site" >&2; exit 1; }

      - name: build and push
        env:
          REGISTRY_PASSWORD: "${{ secrets.REGISTRY_PUSH_TOKEN }}"
        run: |
          set -eu
          if [ -z "$REGISTRY_PASSWORD" ]; then
            echo "REGISTRY_PUSH_TOKEN is not set on this repo" >&2
            exit 1
          fi
          sha12="${GITHUB_SHA:0:12}"
          image="git.tenfourty.site/jeremy/artifacts:${sha12}"

          printf '%s' "$REGISTRY_PASSWORD" | docker login git.tenfourty.site \
            -u "${{ github.repository_owner }}" --password-stdin

          docker build --network host -t "$image" .
          docker push "$image"

  deploy:
    needs: image
    runs-on: docker
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: bump the deploy tag
        run: |
          set -eu
          git fetch origin main
          sha12="${GITHUB_SHA:0:12}"

          git config user.name "artifacts-ci"
          git config user.email "ci@git.tenfourty.site"

          # The whole change is one mechanical line edit with no other local commits
          # to preserve, so "reapply the edit on top of the latest origin/main" is
          # `git switch -C main origin/main` + sed + commit -- equivalent to a
          # fetch-and-rebase for this one-line bump, and simpler to make idempotent
          # across the one retry below. The guard runs INSIDE this function, right
          # after the switch, so the retry (which re-fetches a moved origin/main)
          # re-checks it too, against the origin/main IT sees, instead of trusting
          # a check the first call already made against a now-stale origin/main.
          #
          # `set -e` does NOT apply inside this function while a caller tests its
          # exit status (`if bump_and_push; ...` below) -- a failing command deep
          # inside would otherwise be silently skipped past, not caught. Every
          # failure this function must act on is therefore checked and `return`ed
          # explicitly, using exit codes distinct from git's own (usually 1) so the
          # caller can tell "the guard said stand down" from "a plain push race":
          # 10 = guard says stand down, 12 = guard hit a git error, 13 = the
          # newTag: sed did not touch exactly one line, 14/15/16 = `git switch`/
          # `add`/`commit` failed before anything was pushed, 17/18 = the fetch
          # after a successful push failed, or what actually landed on
          # origin/main does not match what we just pushed. 12/13/17/18 all exit
          # the job without retrying -- 17/18 in particular happen AFTER a push
          # already succeeded, so retrying would push a second, redundant bump
          # commit rather than fix anything. Anything else (a plain nonzero from
          # `git push` itself) is treated as a push race worth one retry.
          bump_and_push() {
            git switch -C main origin/main || return 14

            .forgejo/scripts/deploy-guard.sh "$GITHUB_SHA" HEAD
            guard_status=$?
            if [ "$guard_status" -eq 1 ]; then
              return 10
            elif [ "$guard_status" -ne 0 ]; then
              return 12
            fi

            # Compared as STRINGS, not `-ne`: if deploy/kustomization.yaml is
            # missing, `grep -c` prints nothing to stdout (its own error goes to
            # stderr), so `before`/`after` are empty -- `[ "" -ne 1 ]` itself
            # errors ("integer expression expected"), which makes the `if`
            # condition false and this check silently passes. `[ "$before" != 1 ]`
            # has no such hole: an empty string is simply not equal to "1".
            before=$(grep -c '^[[:space:]]*newTag: ' deploy/kustomization.yaml)
            sed -i -E 's#^([[:space:]]*)newTag: .*#\1newTag: '"$sha12"'#' deploy/kustomization.yaml
            after=$(grep -c '^[[:space:]]*newTag: ' deploy/kustomization.yaml)
            if [ "$before" != 1 ] || [ "$after" != 1 ]; then
              echo "expected exactly 1 newTag: line before and after editing, found '$before' and '$after'" >&2
              return 13
            fi

            git add deploy/kustomization.yaml || return 15
            git commit -m "deploy: artifacts ${sha12} [skip ci]" || return 16
            git push origin main || return $?

            # Trust but verify: confirm what actually landed on origin/main is
            # the bump we think we just pushed, not just that `git push` itself
            # returned 0.
            git fetch origin main || return 17
            landed=$(git show origin/main:deploy/kustomization.yaml \
              | sed -n -E 's/^[[:space:]]*newTag: (.*)$/\1/p')
            if [ "$landed" != "$sha12" ]; then
              echo "origin/main's newTag is '${landed}', expected ${sha12} -- the push did not land what we think it did" >&2
              return 18
            fi
          }

          # `bump_and_push || status=$?` would capture `true`'s status (0), not
          # the function's -- `if`/`else` is the idiom that both suppresses
          # `errexit` for the call and hands back its real exit status.
          if bump_and_push; then
            status=0
          else
            status=$?
          fi
          case "$status" in
            0) exit 0 ;;
            10) echo "standing down: a newer run's deploy already won"; exit 0 ;;
            12|13|17|18) echo "deploy guard, edit-count, or post-push verification failed hard -- not retrying" >&2; exit "$status" ;;
          esac

          echo "push race (a newer bump landed first) -- fetching and retrying once"
          git fetch origin main
          if bump_and_push; then
            status=0
          else
            status=$?
          fi
          case "$status" in
            0) exit 0 ;;
            10) echo "standing down: a newer run's deploy already won"; exit 0 ;;
            *) echo "bump_and_push failed on the retry too (status=$status)" >&2; exit "$status" ;;
          esac
